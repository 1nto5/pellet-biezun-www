# Builds the site on every push and publishes the build of main to GitHub
# Pages, as a preview copy at https://<owner>.github.io/<repo>/.
#
# The build goes to the gh-pages branch as a single fresh commit, so the
# branch holds only the current site. GitHub Pages serves that branch
# (Settings → Pages → Deploy from a branch → gh-pages, / (root)).
#
# The build runs other people's code (packages, their install scripts, the
# build tools), so it gets a read-only token and keeps no credentials. Only
# the publish job, which runs nothing but git, may write to the repository.
#
# Production stays on Cloudflare Pages; this copy is built with its own
# address in SITE, which also marks it noindex (src/lib/env.ts).
name: Build and publish

on:
  push:
    branches-ignore: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version

      # The version in package.json's packageManager, the one the lockfile was made with.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Downloaded packages, and Astro's resized images, which otherwise take
      # most of the build.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules/.astro
          key: build-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/assets/**') }}
          restore-keys: |
            build-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            build-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - run: bun run check

      - name: Build for the GitHub Pages address
        run: |
          export SITE="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          echo "Building for $SITE"
          bun run build

      - name: Keep the build for publishing
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 1

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Publish to the gh-pages branch
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Without it GitHub Pages runs Jekyll, which drops _astro/.
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Publish ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
